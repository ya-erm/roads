<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Развязка — тестовые страницы</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --panel: rgba(255, 255, 255, 0.92);
        --ink: #1f2933;
        --muted: #6b7785;
        --accent: #2f80ed;
        --shadow: 0 6px 24px rgba(30, 40, 30, 0.18);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #b8c79a;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      main {
        margin: 48px 16px;
        width: min(640px, 100%);
        background: var(--panel);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px 20px 14px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 14px;
      }
      #pages {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .page {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 10px;
        border: 2px solid transparent;
        color: inherit;
        text-decoration: none;
        background: #f4f6f8;
      }
      .page:hover {
        border-color: var(--accent);
        background: #e7f0fd;
      }
      .icon {
        flex: none;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
      }
      .text b {
        font-size: 15px;
      }
      code {
        font-size: 12px;
        color: var(--accent);
        margin-left: 4px;
      }
      .what {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      footer {
        margin-top: 12px;
        font-size: 13px;
      }
      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Тестовые страницы</h1>
      <div class="sub">Готовые сцены и лаборатории: открыть и сразу смотреть, без своей партии</div>
      <nav id="pages"></nav>
      <footer><a href="/">← к игре</a></footer>
    </main>
    <script type="module" src="/src/testpages/catalog.ts"></script>
  </body>
</html>
